    <style>
        /* =========================================
           ESTILOS ESPECÍFICOS DE LA PÁGINA DE DETALLE
           ========================================= */
        
        /* --- HERO HEADER --- */
        .project-hero {
            position: relative;
            height: 50vh;
            min-height: 400px;
            display: flex; align-items: center; justify-content: center;
            text-align: center;
            background-size: cover; background-position: center; background-repeat: no-repeat;
            background-color: var(--dark); 
            margin-top: -1px;
        }

        .project-hero::before {
            content: '';
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85); 
            backdrop-filter: blur(4px);
        }

        .project-hero-content {
            position: relative; z-index: 2;
            max-width: 900px; padding: 0 20px;
            animation: fadeInUp 0.8s ease;
        }

        .project-hero h1 {
            font-size: 3.5rem; margin-bottom: 1rem;
            text-shadow: 0 4px 15px rgba(0,0,0,0.5); line-height: 1.1;
        }

        .project-hero .subtitle {
            font-size: 1.3rem; color: #cbd5e1; font-weight: 300;
        }

        /* --- BOTÓN VOLVER FLOTANTE --- */
        .btn-back-floating {
            position: absolute; top: 40px; left: 5%; z-index: 10;
            background: rgba(30, 41, 59, 0.6); 
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 10px 20px; border-radius: 30px;
            cursor: pointer; font-size: 1rem; font-weight: 500;
            transition: all 0.3s ease;
            display: flex; align-items: center; gap: 10px;
        }
        .btn-back-floating:hover {
            background: var(--primary); transform: translateX(-5px); border-color: transparent;
        }

        /* --- LAYOUT PRINCIPAL --- */
        .project-details-container {
            display: grid;
            grid-template-columns: 2fr 1fr; /* 66% Contenido - 33% Sidebar */
            gap: 4rem;
            padding: 4rem 5%;
            max-width: 1400px; margin: 0 auto;
        }

        /* Texto */
        .content-section h2 {
            text-align: left; margin-bottom: 1.5rem; color: var(--primary);
            border-bottom: 2px solid rgba(59, 130, 246, 0.3);
            display: inline-block; padding-bottom: 5px;
        }
        .content-section h2::after { display: none; } 

        .content-text {
            font-size: 1.1rem; line-height: 1.8; color: #e2e8f0;
            white-space: normal;
        }

        /* --- ACORDEONES --- */
        .accordion-container { margin-top: 2rem; }
        .accordion-item {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px; margin-bottom: 1rem; overflow: hidden;
            transition: all 0.3s ease;
        }
        .accordion-item:hover { border-color: var(--primary); }
        .accordion-header {
            width: 100%; padding: 1.2rem;
            background: transparent; border: none; outline: none;
            text-align: left; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
            color: var(--text); font-size: 1.1rem; font-weight: 600;
        }
        .accordion-header i { transition: transform 0.3s ease; color: var(--primary); }
        .accordion-item.active .accordion-header i { transform: rotate(180deg); }
        .accordion-item.active { background: rgba(30, 41, 59, 0.8); border-color: var(--primary); }
        .accordion-body {
            max-height: 0; overflow: hidden;
            transition: max-height 0.3s ease-out;
            padding: 0 1.2rem; color: var(--text-muted);
        }
        .accordion-item.active .accordion-body { padding-bottom: 1.2rem; }

        /* --- SIDEBAR --- */
        .sidebar-card {
            background: var(--card-bg); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; padding: 2rem;
            position: sticky; top: 120px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .sidebar-section { margin-bottom: 2rem; }
        .sidebar-section h3 { 
            font-size: 1.1rem; margin-bottom: 1rem; 
            color: #94a3b8; text-transform: uppercase; letter-spacing: 1px;
            border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.5rem; 
        }
        .sidebar-section h3::after { display: none; }
        .sidebar-techs { display: flex; flex-wrap: wrap; gap: 10px; }
        .sidebar-techs span {
            background: rgba(59, 130, 246, 0.15); color: #60a5fa;
            padding: 6px 14px; border-radius: 20px; font-size: 0.85rem;
            border: 1px solid rgba(59, 130, 246, 0.2); font-weight: 500;
        }
        .action-btns { display: flex; flex-direction: column; gap: 12px; }
        .action-btns .btn { width: 100%; justify-content: center; margin: 0; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .content-text p { margin-bottom: 1.2rem; }

        /* --- METADATOS DEL HERO --- */
        .hero-meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 1.5rem; }
        .hero-meta .card-badge { margin-bottom: 0; align-self: auto; font-size: 0.85rem; }
        .hero-pill {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255, 255, 255, 0.12);
            color: #cbd5e1; padding: 5px 14px; border-radius: 20px; font-size: 0.85rem;
        }
        .hero-pill i { color: var(--primary); }

        /* --- FICHA DEL PROYECTO --- */
        .project-facts { list-style: none; display: grid; gap: 1rem; }
        .project-facts li { display: flex; gap: 12px; align-items: flex-start; color: #e2e8f0; font-size: 0.95rem; line-height: 1.5; }
        .project-facts i { color: var(--primary); width: 18px; margin-top: 3px; text-align: center; flex: none; }
        .project-facts span { display: block; color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .demo-note { color: var(--text-muted); font-size: 0.85rem; line-height: 1.5; }
        .demo-note i { color: var(--primary); margin-right: 4px; }

        /* --- RESULTADOS --- */
        .results-card {
            background: var(--card-bg); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 1.5rem;
        }
        .results-scroll { overflow-x: auto; }
        .results-table { width: 100%; border-collapse: collapse; font-size: 0.95rem; font-variant-numeric: tabular-nums; }
        .results-table th, .results-table td { padding: 0.75rem 0.9rem; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
        .results-table thead th { color: #60a5fa; font-weight: 600; border-bottom: 2px solid rgba(59, 130, 246, 0.4); white-space: nowrap; }
        .results-table tbody th { font-weight: 500; color: #e2e8f0; }
        .results-table td { color: #cbd5e1; }
        .results-table .num { text-align: right; white-space: nowrap; }
        .results-table strong { color: #f9a8d4; }
        .results-table tbody tr:hover { background: rgba(59, 130, 246, 0.06); }
        .results-note { margin-top: 1rem; color: var(--text-muted); font-size: 0.9rem; line-height: 1.6; }
        .results-note i { color: var(--primary); margin-right: 4px; }

        /* Responsive */
        @media (max-width: 900px) {
            .project-details-container { grid-template-columns: 1fr; gap: 3rem; }
            .sidebar-card { position: static; } 
            .project-hero h1 { font-size: 2.5rem; }
            .btn-back-floating { top: 20px; padding: 8px 15px; font-size: 0.9rem; }
        }
    </style>
